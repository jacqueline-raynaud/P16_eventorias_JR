name: Build & upload to Firebase App Distribution

on:
  push:
    tags:
      - 'v*' # Le script se lance si le tag commence par "v" (ex: v1.0, v1.2.3)

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name : Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Créer le fichier keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: DEBUG - vérifier le keystore
        run: |
          ls -la app/release.keystore
          file app/release.keystore

      - name: Créer local.properties (Maps + signature)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "google.maps.key=$MAPS_API_KEY" > local.properties
          echo "storeFile=release.keystore" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> local.properties

      - name: create google service json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run:
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json


      - name: build apk
        run: ./gradlew assembleRelease

      - name: upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}  # identifiant de l'application Firebase
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # fichier JSON
          groups: testers  # groupe créé dans Firebase App Distribution console
          file: app/build/outputs/apk/release/app-release.apk